name: Deploy api to apitest.elma.online

on:
  push:
    branches:
      - dev
    paths:
      - "api/**"
      - "contract/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: contains(github.event.head_commit.message, 'skip ci') == false
    name: typecheck, importscheck and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: api/.nvmrc
          cache: yarn
          cache-dependency-path: api/yarn.lock

      - name: Install dependencies
        working-directory: ./api
        run: yarn install --immutable

      - name: Typecheck
        working-directory: ./api
        run: yarn typecheck

      - name: Importscheck
        working-directory: ./api
        run: yarn importscheck

      - name: Lint
        working-directory: ./api
        run: yarn lint

  build:
    needs: check
    if: contains(github.event.head_commit.message, 'skip ci') == false
    name: ssh into server, pull from repo, install deps, restart in pm2
    runs-on: ubuntu-latest
    steps:
      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh
            set -e
            corepack enable
            cd ${{ secrets.SSH_PATH }}
            git restore yarn.lock
            git pull
            nice -n 10 yarn workspaces focus --production
            pm2 restart api
